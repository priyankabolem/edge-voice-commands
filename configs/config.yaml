seed: 1234

paths:
  data_root: data
  dataset_dir: data/SpeechCommands/speech_commands_v0.02
  features_dir: data/features
  results_dir: results

data:
  sample_rate: 16000
  clip_samples: 16000
  keywords: ["yes", "no", "up", "down", "left", "right", "on", "off", "stop", "go"]
  unknown_label: _unknown_
  silence_label: _silence_
  # Fraction of each split that is _silence_ crops.
  silence_fraction: 0.1
  # Each background-noise file is cut by time into disjoint train/val/test regions
  # so that silence crops and augmentation noise never leak across splits.
  noise_split: {training: 0.8, validation: 0.1, testing: 0.1}
  # Silence crops are scaled by a gain drawn uniformly from [0, max_gain].
  silence_max_gain: 1.0

features:
  frame_length: 400
  hop_length: 160
  n_fft: 512
  n_mels: 40
  f_min: 20.0
  f_max: 7600.0
  log_offset: 1.0e-6

augmentation:
  time_shift_ms: 100
  noise_prob: 0.8
  noise_max_gain: 0.1

model:
  channels: 64
  num_blocks: 4
  first_kernel: [10, 4]
  first_stride: [2, 2]
  first_padding: [4, 1]
  max_params: 50000

train:
  epochs: 30
  batch_size: 128
  lr: 1.0e-3
  label_smoothing: 0.1
  num_workers: 6
  checkpoint: models/kws_fp32.pt

quantization:
  # Calibration uses clean (un-augmented) training clips only.
  calibration_samples: 500
  per_channel: true
  experiment_calibration_sizes: [100, 500, 2000]
  quantized_program: models/kws_int8_pt2e.pt2

export:
  fp32_pte: models/kws_fp32.pte
  int8_pte: models/kws_int8.pte

benchmark:
  threads: [1, 4]
  warmup: 50
  iters: 1000
  repeats: 3
  profile:
    threads: 1
    iters: 200

stream:
  # Stream construction (scripts/make_stream.py); one stream per split.
  clips_per_keyword: 3
  num_unknown: 15
  num_noise_gaps: 8
  gap_s: [0.8, 1.6]
  noise_gain: 0.1
  onset_rel_threshold: 0.1
  # Detection (cpp/apps/stream.cc).
  threads: 1
  infer_every_hops: 2
  smoothing_window: 5
  refractory_s: 1.0
  min_consecutive: 1
  # Evaluation (kws/evaluate_stream.py).
  tolerance_s: 0.75
  sweep_thresholds: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]
  # Optional extra 2: detector settings compared by kws/compare_streaming.py.
  compare_min_consecutive: [1, 3]

# Optional extra 2: a streaming-aware model trained with larger time shifts and
# word-tail negatives. Selected with --variant streaming_model; all outputs go to its
# own model files and results directory, so the baseline stays unchanged.
variants:
  streaming_model:
    paths:
      results_dir: results/streaming_model
    augmentation:
      time_shift_ms: 300
      keyword_keep_min: 0.8
      tail_negative_prob: 0.2
      tail_visible: [0.15, 0.6]
      onset_rel_threshold: 0.1
    train:
      checkpoint: models/kws_stream_fp32.pt
    quantization:
      quantized_program: models/kws_stream_int8_pt2e.pt2
    export:
      fp32_pte: models/kws_stream_fp32.pte
      int8_pte: models/kws_stream_int8.pte
